<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 930" role="img" aria-labelledby="t d"><title id="t">HELP user flow</title><desc id="d">Choose contacts, hold HELP, alert is sent, helper acknowledges, sender closes HELP.</desc><rect width="920" height="930" fill="#f4f7fa"/><rect x="40" y="25" width="840" height="132" rx="18" fill="#144c60"/><text x="460" y="74" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="30" font-weight="700">1. CHOOSE CONTACTS</text><text x="460" y="121" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="27">Settings &gt; Safety &gt; HELP</text><path d="M460 165v29m-13-12 13 14 13-14" stroke="#144c60" stroke-width="5" fill="none"/><rect x="40" y="205" width="840" height="132" rx="18" fill="#b52327"/><text x="460" y="254" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="30" font-weight="700">2. HOLD FOR 2 SECONDS</text><text x="460" y="301" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="27">An open HELP alert is stored</text><path d="M460 345v29m-13-12 13 14 13-14" stroke="#144c60" stroke-width="5" fill="none"/><rect x="40" y="385" width="840" height="132" rx="18" fill="#b52327"/><text x="460" y="434" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="30" font-weight="700">3. HELP IS SENT</text><text x="460" y="481" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="27">Type messages while waiting</text><path d="M460 525v29m-13-12 13 14 13-14" stroke="#144c60" stroke-width="5" fill="none"/><rect x="40" y="565" width="840" height="132" rx="18" fill="#12653f"/><text x="460" y="614" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="30" font-weight="700">4. SOMEONE IS COMING</text><text x="460" y="661" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="27">A helper acknowledges HELP</text><path d="M460 705v29m-13-12 13 14 13-14" stroke="#144c60" stroke-width="5" fill="none"/><rect x="40" y="745" width="840" height="132" rx="18" fill="#144c60"/><text x="460" y="794" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="30" font-weight="700">5. I&#x27;M OK NOW</text><text x="460" y="841" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="27">Close HELP and stop reminders</text></svg>