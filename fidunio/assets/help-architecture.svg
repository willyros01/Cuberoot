<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 920" role="img" aria-labelledby="t d"><title id="t">HELP resource boundaries</title><desc id="d">The shared HELP owner uses operational alert metadata for notifications, while messages and location use the existing encrypted chat services. Both converge at the helper app.</desc><rect width="920" height="920" fill="#f4f7fa"/><rect x="45" y="40" width="830" height="120" rx="18" fill="#144c60"/><text x="460.0" y="88" text-anchor="middle" font-family="Arial,sans-serif" fill="white" font-size="27" font-weight="700">SHARED APP / HELP OWNER</text><text x="460.0" y="128" text-anchor="middle" font-family="Arial,sans-serif" fill="white" font-size="24">One account lifecycle and route owner</text><rect x="45" y="245" width="395" height="155" rx="18" fill="#144c60"/><text x="242.5" y="293" text-anchor="middle" font-family="Arial,sans-serif" fill="white" font-size="27" font-weight="700">HELP METADATA</text><text x="242.5" y="333" text-anchor="middle" font-family="Arial,sans-serif" fill="white" font-size="24">Alerts, contacts, acknowledgements</text><text x="242.5" y="367" text-anchor="middle" font-family="Arial,sans-serif" fill="white" font-size="24"></text><rect x="480" y="245" width="395" height="155" rx="18" fill="#144c60"/><text x="677.5" y="293" text-anchor="middle" font-family="Arial,sans-serif" fill="white" font-size="27" font-weight="700">ENCRYPTED CHAT</text><text x="677.5" y="333" text-anchor="middle" font-family="Arial,sans-serif" fill="white" font-size="24">Messages and location</text><text x="677.5" y="367" text-anchor="middle" font-family="Arial,sans-serif" fill="white" font-size="24">cards</text><rect x="45" y="495" width="395" height="155" rx="18" fill="#144c60"/><text x="242.5" y="543" text-anchor="middle" font-family="Arial,sans-serif" fill="white" font-size="27" font-weight="700">HELP SERVER + PUSH</text><text x="242.5" y="583" text-anchor="middle" font-family="Arial,sans-serif" fill="white" font-size="24">FCM / APNs</text><text x="242.5" y="617" text-anchor="middle" font-family="Arial,sans-serif" fill="white" font-size="24">/ Fire ADM</text><rect x="480" y="495" width="395" height="155" rx="18" fill="#144c60"/><text x="677.5" y="543" text-anchor="middle" font-family="Arial,sans-serif" fill="white" font-size="27" font-weight="700">MESSAGE SERVICES</text><text x="677.5" y="583" text-anchor="middle" font-family="Arial,sans-serif" fill="white" font-size="24">Existing E2EE /</text><text x="677.5" y="617" text-anchor="middle" font-family="Arial,sans-serif" fill="white" font-size="24">Outbox / receipts</text><rect x="45" y="755" width="830" height="120" rx="18" fill="#144c60"/><text x="460.0" y="803" text-anchor="middle" font-family="Arial,sans-serif" fill="white" font-size="27" font-weight="700">HELPER&#x27;S APP</text><text x="460.0" y="843" text-anchor="middle" font-family="Arial,sans-serif" fill="white" font-size="24">Unlock &gt; HELP screen &gt; I&#x27;m coming</text><path d="M460 160v40H242v35" stroke="#144c60" stroke-width="5" fill="none"/><path d="M678 200v35" stroke="#144c60" stroke-width="5" fill="none"/><path d="M242 400v85" stroke="#144c60" stroke-width="5" fill="none"/><path d="M678 400v85" stroke="#144c60" stroke-width="5" fill="none"/><path d="M242 650v65h218v30" stroke="#144c60" stroke-width="5" fill="none"/><path d="M678 650v65H460" stroke="#144c60" stroke-width="5" fill="none"/></svg>