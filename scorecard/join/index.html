<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Join The Scorecard</title>
<style>
:root{color-scheme:light dark;--bg:#fbf7ee;--card:#fff;--ink:#14261f;--pine:#1f5641;--line:#d5cbb4}
@media(prefers-color-scheme:dark){:root{--bg:#101713;--card:#19231e;--ink:#f4f2e9;--pine:#80c9aa;--line:#3a4a42}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:21px;line-height:1.6}
main{max-width:720px;margin:12vh auto;padding:32px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px}h1{font-family:Georgia,serif;font-size:42px;line-height:1.1;margin:0 0 16px}a{color:var(--pine);font-weight:700}
</style>
<script src="forward.js" defer></script>
</head>
<body><main><div class="card"><h1>The Scorecard</h1><p data-status hidden>No invitation was included in this link.</p><p><a data-web-link href="https://willyros01.github.io/scorecard/">Open The Scorecard web app</a></p></div></main></body>
</html>
