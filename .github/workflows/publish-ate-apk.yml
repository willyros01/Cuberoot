name: Publish ATE Android APK

# First permanently signed ATE APK verified; publish the current artifact now.
# Every successful ATE Android build records ate-last-run.json on the clear-page apk-releases branch.
# This workflow polls that verified result every 5 minutes and publishes only successful APKs.
# Schedule is required because repository GitHub tokens cannot write to another repo.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ate-apk.yml'
      - 'build/publish-ate.sh'

permissions:
  contents: write
  pages: write

concurrency:
  group: cuberoot-ate-apk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK for signature verification
        run: |
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms"
      - name: Publish latest successful ATE Android APK
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BEFORE=$(git rev-parse HEAD)
          bash build/publish-ate.sh
          if [ "$BEFORE" != "$(git rev-parse HEAD)" ]; then echo 'published=true' >> "$GITHUB_OUTPUT"; fi
      - name: Deploy the new APK on Pages
        if: steps.publish.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --request POST --header "Authorization: Bearer $GITHUB_TOKEN" --header 'Accept: application/vnd.github+json' 'https://api.github.com/repos/willyros01/Cuberoot/pages/builds' > "$RUNNER_TEMP/pages-build.json"
