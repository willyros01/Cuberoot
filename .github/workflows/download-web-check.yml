name: Verify website download clicks
on:
  push:
    branches: [main, ate-download-web]
    paths:
      - 'assets/js/*download*.js'
      - 'assets/js/apk-firebase-*.js'
      - 'assets/js/admin.js'
      - 'index.html'
      - 'ate/index.html'
      - 'admin/index.html'
      - 'cockpit/index.html'
      - 'build/downloads/**'
      - '.github/workflows/download-web-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare browser test runner
        run: npm install --prefix "$RUNNER_TEMP/download-web" --no-save playwright@1.62.1
      - name: Verify scoped counter activation and rollback logic offline
        run: |
          bash -n atec.txt
          python3 -m unittest discover -s build/downloads -p '*_test.py' -v
      - name: Verify download actions, tracking and private cockpit
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/download-web/node_modules/playwright/index.mjs
          BROWSER_EXECUTABLE: /usr/bin/google-chrome
          EVIDENCE_DIR: ${{ runner.temp }}/download-evidence
        run: node build/downloads/web-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: download-web-evidence
          path: ${{ runner.temp }}/download-evidence
