name: The Marker source-matched guide illustrations
on:
  push:
    branches: [main]
    paths:
      - "marker/screens/**"
      - "marker/assets/marker-source.css"
      - "marker/build-guides.mjs"
      - ".github/workflows/marker-guide-illustrations.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node marker/build-guides.mjs
      - name: Commit documentation only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marker/assets/screens marker/quick-start/index.html marker/guide/index.html guides/the-marker guides/index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Marker code-rendered screenshots and matching PDF guides"
          git push origin HEAD:main
