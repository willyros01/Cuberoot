name: APK Daily Email Sender Safety Test
on:
  push:
    branches: [apk-email-activation-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  email-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify disabled-mode mail sender without credentials or data
        env:
          APK_COUNTER_DAILY_EMAIL_ENABLED: 'false'
        run: |
          python3 -m py_compile build/apk-counter/daily-email.py
          python3 build/apk-counter/daily-email.py
      - name: Verify report generation and Toronto day boundaries offline
        run: |
          python3 - <<'PY'
          import importlib.util, datetime as dt
          from pathlib import Path
          from zoneinfo import ZoneInfo
          path=Path('build/apk-counter/daily-email.py')
          spec=importlib.util.spec_from_file_location('cuberoot_mail',path)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          expected=set(slug for slug,name in m.APPS)
          assert len(expected)==6
          original_count=m.firestore_count
          original_recent=m.firestore_recent
          m.firestore_count=lambda app,token,start=None,end=None: 2 if start else 5
          m.firestore_recent=lambda app,token: []
          now=dt.datetime(2026,10,16,13,17,tzinfo=dt.timezone.utc)
          subject,body=m.create_summary('TEST_NO_AUTH',now)
          assert '2026-10-15' in subject
          assert 'Recorded clicks yesterday: 12' in body
          assert 'All recorded clicks since tracking began: 30' in body
          assert all(name in body for slug,name in m.APPS)
          assert body.count('Source: Cuberoot APK counter')==1
          assert m.toronto_day_bounds(now)[0].isoformat()=='2026-10-15'
          # In both DST transitions, the previous day is correct.
          winter=dt.datetime(2026,1,10,14,17,tzinfo=dt.timezone.utc)
          assert m.toronto_day_bounds(winter)[0].isoformat()=='2026-01-09'
          assert m.toronto_day_bounds(winter)[1].hour==5
          summer=dt.datetime(2026,7,10,13,17,tzinfo=dt.timezone.utc)
          assert m.toronto_day_bounds(summer)[0].isoformat()=='2026-07-09'
          assert m.toronto_day_bounds(summer)[1].hour==4
          print('PASS: correct synthetic counts, no network, two timezone offsets, no false send')
          PY
