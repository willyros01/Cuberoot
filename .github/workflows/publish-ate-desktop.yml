name: Publish ATE desktop installers
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths: ['build/publish-ate-desktop.sh', '.github/workflows/publish-ate-desktop.yml']
permissions:
  contents: write
concurrency:
  group: cuberoot-ate-desktop
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const r=await fetch('https://raw.githubusercontent.com/willyros01/clear-page/desktop-releases/ate-desktop-last-run.json?t='+Date.now(),{headers:{'Cache-Control':'no-cache'}});
          let ready=false;
          if(r.status!==404){
            if(!r.ok)throw Error('Report lookup HTTP '+r.status);
            const report=await r.json();let current={};
            try{current=JSON.parse(readFileSync('downloads/ate-desktop-build.json','utf8'))}catch{}
            let macReady=false;
            if(report.mac_artifact_id){
              const jobs=await fetch('https://api.github.com/repos/willyros01/clear-page/actions/runs/'+report.run_id+'/jobs?per_page=100',{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json'}});
              if(!jobs.ok)throw Error('Mac verification job lookup HTTP '+jobs.status);
              macReady=(await jobs.json()).jobs.some(j=>j.name.includes('mac-release')&&j.name.includes('website')&&j.conclusion==='success');
            }
            ready=!!((report.windows_artifact_id&&(current.windows?.run_id||0)<report.run_id)||(macReady&&(current.mac?.run_id||0)<report.run_id));
          }
          appendFileSync(process.env.GITHUB_OUTPUT,'ready='+ready+'\n');
          JS
  publish:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and publish exact built installers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/publish-ate-desktop.sh
