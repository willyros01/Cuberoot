name: Publish ATE desktop installers
# ATE 0.5.3 run 43222957484: read the current release report from GitHub's API.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths: ['build/publish-ate-desktop.sh', '.github/workflows/publish-ate-desktop.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: cuberoot-ate-desktop
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const r=await fetch('https://api.github.com/repos/willyros01/clear-page/contents/ate-desktop-last-run.json?ref=desktop-releases',{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','Cache-Control':'no-cache'}});
          let ready=false;
          if(r.status!==404){
            if(!r.ok)throw Error('Report lookup HTTP '+r.status);
            const lookup=await r.json();
            const report=JSON.parse(Buffer.from(lookup.content,'base64').toString('utf8'));let current={};
            try{current=JSON.parse(readFileSync('downloads/ate-desktop-build.json','utf8'))}catch{}
            let macReady=false;
            if(report.mac_artifact_id){
              const jobs=await fetch('https://api.github.com/repos/willyros01/clear-page/actions/runs/'+report.run_id+'/jobs?per_page=100',{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json'}});
              if(!jobs.ok)throw Error('Mac verification job lookup HTTP '+jobs.status);
              macReady=(await jobs.json()).jobs.some(j=>j.name.includes('mac-release')&&j.name.includes('website')&&j.conclusion==='success');
            }
            ready=!!((report.windows_artifact_id&&(current.windows?.run_id||0)<report.run_id)||(macReady&&(current.mac?.run_id||0)<report.run_id));
          }
          console.log('Verified desktop release ready for publication: '+ready);
          appendFileSync(process.env.GITHUB_OUTPUT,'ready='+ready+'\n');
          JS
  publish:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and publish exact built installers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/publish-ate-desktop.sh
      - name: Request Pages deployment of the published installers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/willyros01/Cuberoot/pages/builds' > "$RUNNER_TEMP/pages-build.json"
      - name: Verify public installers match the published manifests
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const expected=JSON.parse(readFileSync('downloads/ate-desktop-build.json','utf8'));
          const base='https://www.cuberoot-systems.com/downloads/';
          let last='Waiting for Pages';
          for(let attempt=0;attempt<36;attempt++){
            try{
              for(const platform of ['mac','windows']){
                const m=expected[platform];if(!m)continue;
                const r=await fetch(base+m.file+'?build='+m.run_id+'&verify='+Date.now(),{signal:AbortSignal.timeout(30000)});
                if(!r.ok)throw Error(platform+' HTTP '+r.status);
                const b=Buffer.from(await r.arrayBuffer());
                if(b.length!==m.bytes||createHash('sha256').update(b).digest('hex')!==m.sha256)throw Error(platform+' public download differs from the release manifest');
                console.log('PASS: public '+platform+' '+m.version+' SHA-256 and '+b.length+' bytes verified');
              }
              process.exit(0);
            }catch(error){last=error.message;console.log(last)}
            if(attempt<35)await new Promise(resolve=>setTimeout(resolve,10000));
          }
          throw Error('Public installer verification failed: '+last);
          JS
