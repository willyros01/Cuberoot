name: Publish ATE desktop installers
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths: ['build/publish-ate-desktop.sh', '.github/workflows/publish-ate-desktop.yml']
permissions:
  contents: write
concurrency:
  group: cuberoot-ate-desktop
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const r=await fetch('https://raw.githubusercontent.com/willyros01/clear-page/desktop-releases/ate-desktop-last-run.json',{headers:{'Cache-Control':'no-cache'}});
          let ready=false;
          if(r.status!==404){
            if(!r.ok)throw Error('Report lookup HTTP '+r.status);
            const report=await r.json();let current={};
            try{current=JSON.parse(readFileSync('downloads/ate-desktop-build.json','utf8'))}catch{}
            ready=['windows','mac'].some(p=>report[p+'_artifact_id']&&(current[p]?.run_id||0)<report.run_id);
          }
          appendFileSync(process.env.GITHUB_OUTPUT,'ready='+ready+'\n');
          JS
  publish:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and publish exact built installers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/publish-ate-desktop.sh
