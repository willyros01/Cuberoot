name: Publish ATE desktop installers
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths: ['build/publish-ate-desktop.sh', '.github/workflows/publish-ate-desktop.yml']
permissions:
  contents: write
concurrency:
  group: cuberoot-ate-desktop
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and publish exact built installers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/publish-ate-desktop.sh
