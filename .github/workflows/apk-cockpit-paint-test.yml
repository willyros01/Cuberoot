name: APK Cockpit Paint Before Firebase Test
on:
  push:
    branches: [apk-cockpit-paint-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-load-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check assets/js/downloads-admin.js
          node --check assets/js/downloads-ui.js
          node --check assets/js/apk-firebase-report.js
          node --check assets/js/admin.js
      - name: Check loading order and unchanged Firebase query contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lazy=Path('assets/js/downloads-admin.js').read_text()
          ui=Path('assets/js/downloads-ui.js').read_text()
          report=Path('assets/js/apk-firebase-report.js').read_text()
          page=Path('admin/index.html').read_text()
          assert "import('./apk-firebase-report.js?v=2')" in lazy
          assert "from './apk-firebase-report.js" not in lazy
          assert "root.append(intro,actions,status,placeholder,panel);" in lazy
          assert lazy.index("root.append(intro,actions,status,placeholder,panel);") < lazy.index("reportModule().then")
          assert "requestAnimationFrame(afterPaint)" in lazy
          assert "showPending();" in ui
          assert ui.index("showPending();") < ui.index("async function update()")
          assert "requestAnimationFrame(afterPaint)" in ui
          assert "Promise.all(APPS.map(async app" in report
          assert report.count("getCountFromServer(")==2
          assert report.count("getDocs(")==1
          assert "admin.js?v=2.1.2" in page
          print("PASS: text and app names render before Firebase import and queries")
          PY
