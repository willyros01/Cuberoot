name: Publish Fairpot Android test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-fairpot-apk.yml'

permissions:
  contents: write

concurrency:
  group: cuberoot-fairpot-apk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out Cuberoot site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Get verified Fairpot Android source
        run: |
          git clone --depth 1 --branch android https://github.com/willyros01/fairpot.git /tmp/fairpot
          cd /tmp/fairpot
          git fetch --depth 1 origin 4cf28232e16df311d5b209fe5ae8c4de708b8d15
          git checkout --detach 4cf28232e16df311d5b209fe5ae8c4de708b8d15
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK
        run: |
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms"
      - name: Build same Android test version
        working-directory: /tmp/fairpot
        run: bash build/android-build.sh
      - name: Publish APK on Cuberoot domain
        run: |
          set -euo pipefail
          install -D -m 0644 /tmp/fairpot/android/app/build/outputs/apk/debug/app-debug.apk downloads/fairpot.apk
          test -s downloads/fairpot.apk
          sha256sum downloads/fairpot.apk | tee downloads/fairpot.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/fairpot.apk downloads/fairpot.apk.sha256
          if git diff --cached --quiet; then
            echo "Same APK already published"
          else
            git commit -m "publish: Fairpot Android debug test APK"
            git push origin HEAD:main
          fi
