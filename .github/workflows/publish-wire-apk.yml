name: Publish Wire Android APK

# Wire Android CI signs/uploads the APK and verifies the artifact. This
# Cuberoot-side workflow retrieves the newest SUCCESSFUL build and publishes
# only the verified, permanently signed APK at /downloads/wire.apk.
# Runs automatically every five minutes; no cross-repository token is needed.
# GitHub scheduled jobs may be delayed, so five minutes is an interval, not an SLA.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-wire-apk.yml'
      - 'build/publish-wire.sh'

permissions:
  contents: write

concurrency:
  group: cuberoot-wire-apk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK for APK signature validation
        run: |
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms"
      - name: Publish latest successful Wire Android APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/publish-wire.sh
