# One private Gmail app password; APK click data is read-only from Firestore.
# No Firebase reporter account or GitHub CLI authentication.
name: Cuberoot APK Daily Gmail Summary

on:
  schedule:
    - cron: '17 9 * * *'
      timezone: 'America/Toronto'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuberoot-apk-daily-gmail
  cancel-in-progress: false

jobs:
  daily-email:
    if: ${{ github.repository == 'willyros01/Cuberoot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Send yesterday's complete six-app summary
        env:
          APK_COUNTER_GMAIL_APP_PASSWORD: ${{ secrets.APK_COUNTER_GMAIL_APP_PASSWORD }}
        run: |
          if [ -z "$APK_COUNTER_GMAIL_APP_PASSWORD" ]; then
            echo "Daily email not configured: add APK_COUNTER_GMAIL_APP_PASSWORD to Actions secrets. No report sent."
            exit 0
          fi
          python3 build/apk-counter/daily-email.py
