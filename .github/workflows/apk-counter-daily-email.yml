# cron-job.org triggers workflow_dispatch; no GitHub scheduling.
# Gmail SMTP via a single 16-character app password secret; no Google Cloud project.
name: Cuberoot APK Daily Gmail Summary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuberoot-apk-daily-gmail
  cancel-in-progress: false

jobs:
  daily-email:
    if: ${{ github.repository == 'willyros01/Cuberoot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify seven-app counting and SMTP sender
        run: |
          python3 -m py_compile build/apk-counter/smtp-daily.py
          python3 build/apk-counter/public-report.py --self-test
          python3 build/apk-counter/smtp-daily.py --self-test
      - name: Send verified daily email via Gmail SMTP
        env:
          CUBEROOT_GMAIL_APP_PASSWORD: ${{ secrets.CUBEROOT_GMAIL_APP_PASSWORD }}
        run: python3 build/apk-counter/smtp-daily.py
