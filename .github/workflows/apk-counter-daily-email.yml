# Original private Firestore read-only reporter. ONE encrypted GitHub secret.
# No Cloud Shell GitHub CLI login or separate Actions enable variable.
name: Cuberoot APK Daily Gmail Summary

on:
  # Legacy SMTP sender kept manual-only; no app password is configured.
  # Automatic email delivery uses the scheduled ChatGPT Gmail task instead.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuberoot-apk-daily-gmail
  cancel-in-progress: false

jobs:
  daily-email:
    if: ${{ github.repository == 'willyros01/Cuberoot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Send authenticated daily click summary
        env:
          APK_COUNTER_MAIL_CONFIG: ${{ secrets.APK_COUNTER_MAIL_CONFIG }}
        run: |
          if [ -z "$APK_COUNTER_MAIL_CONFIG" ]; then
            echo "Daily email not configured. Add APK_COUNTER_MAIL_CONFIG under repository Actions secrets."
            exit 0
          fi
          python3 build/apk-counter/daily-email.py
