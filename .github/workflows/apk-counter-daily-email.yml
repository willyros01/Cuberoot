# STAGED ONLY: this file is not on main, so the schedule does not execute.
# Once merged, still requires APK_COUNTER_DAILY_EMAIL_ENABLED=true.
name: Cuberoot APK Daily Gmail Summary

on:
  schedule:
    - cron: '17 9 * * *'
      timezone: 'America/Toronto'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuberoot-apk-daily-gmail
  cancel-in-progress: false

jobs:
  daily-email:
    if: ${{ github.repository == 'willyros01/Cuberoot' && vars.APK_COUNTER_DAILY_EMAIL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Send yesterday's authenticated, complete summary to owner's Gmail
        env:
          APK_COUNTER_DAILY_EMAIL_ENABLED: ${{ vars.APK_COUNTER_DAILY_EMAIL_ENABLED }}
          APK_COUNTER_FIREBASE_WEB_API_KEY: ${{ vars.APK_COUNTER_FIREBASE_WEB_API_KEY }}
          APK_COUNTER_REPORTER_EMAIL: ${{ secrets.APK_COUNTER_REPORTER_EMAIL }}
          APK_COUNTER_REPORTER_PASSWORD: ${{ secrets.APK_COUNTER_REPORTER_PASSWORD }}
          APK_COUNTER_GMAIL_ADDRESS: ${{ secrets.APK_COUNTER_GMAIL_ADDRESS }}
          APK_COUNTER_GMAIL_APP_PASSWORD: ${{ secrets.APK_COUNTER_GMAIL_APP_PASSWORD }}
        run: python3 build/apk-counter/daily-email.py
