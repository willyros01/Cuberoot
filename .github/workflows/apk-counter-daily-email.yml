# Triggered externally by cron-job.org via workflow_dispatch.
# No GitHub schedule; Gmail API credentials are repository Actions secrets.
name: Cuberoot APK Daily Gmail Summary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuberoot-apk-daily-gmail
  cancel-in-progress: false

jobs:
  daily-email:
    if: ${{ github.repository == 'willyros01/Cuberoot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify script syntax and offline count tests
        run: |
          python3 -m py_compile build/apk-counter/gmail-api-daily.py
          python3 build/apk-counter/public-report.py --self-test
      - name: Send verified seven-app report via Gmail API
        env:
          CUBEROOT_GMAIL_CLIENT_ID: ${{ secrets.CUBEROOT_GMAIL_CLIENT_ID }}
          CUBEROOT_GMAIL_CLIENT_SECRET: ${{ secrets.CUBEROOT_GMAIL_CLIENT_SECRET }}
          CUBEROOT_GMAIL_REFRESH_TOKEN: ${{ secrets.CUBEROOT_GMAIL_REFRESH_TOKEN }}
        run: |
          test -n "$CUBEROOT_GMAIL_CLIENT_ID" || { echo "Gmail client ID not configured"; exit 1; }
          test -n "$CUBEROOT_GMAIL_CLIENT_SECRET" || { echo "Gmail client secret not configured"; exit 1; }
          test -n "$CUBEROOT_GMAIL_REFRESH_TOKEN" || { echo "Gmail refresh token not configured"; exit 1; }
          python3 build/apk-counter/gmail-api-daily.py
