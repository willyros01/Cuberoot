# cron-job.org sends repository_dispatch, like the already-working Wire scheduler.
# Manual workflow_dispatch remains available. GitHub does not schedule these emails.
# Uses one Resend API key; from onboarding@resend.dev to owner's Resend-login email.
name: Cuberoot APK Daily Email

on:
  push:
    paths:
      - '.github/workflows/apk-counter-daily-email.yml'
      - 'build/apk-counter/resend-daily.py'
      - 'build/apk-counter/public-report.py'
  workflow_dispatch:
  repository_dispatch:
    types: [apk-email]

permissions:
  contents: read

concurrency:
  group: cuberoot-apk-email
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify all seven apps, timezone and email send logic (offline)
        run: |
          python3 -m py_compile build/apk-counter/public-report.py build/apk-counter/resend-daily.py
          python3 build/apk-counter/public-report.py --self-test
          python3 build/apk-counter/resend-daily.py --self-test

  send:
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'repository_dispatch' && github.event.action == 'apk-email')) && github.repository == 'willyros01/Cuberoot' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Send verified APK report via Resend
        env:
          CUBEROOT_RESEND_API_KEY: ${{ secrets.CUBEROOT_RESEND_API_KEY }}
        run: python3 build/apk-counter/resend-daily.py
