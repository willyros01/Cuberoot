name: Publish Cloud Files Android APK

# Every successful Cloud Files/android build writes android-last-run.json.
# This workflow polls that verified result every 5 minutes and publishes only successful APKs.
# Schedule is required because repository GitHub tokens cannot write to another repo.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-cloud-files-apk.yml'
      - 'build/publish-cloud-files.sh'

permissions:
  contents: write

concurrency:
  group: cuberoot-cloud-files-apk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK for signature verification
        run: |
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms"
      - name: Publish latest successful Cloud Files Android APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/publish-cloud-files.sh
