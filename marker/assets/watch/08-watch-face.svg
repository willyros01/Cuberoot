<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="645" viewBox="0 0 1000 645" role="img" aria-label="Edit the Apple Watch face to place a Marker watch complication"><title>Edit the Apple Watch face to place a Marker watch complication</title><rect x="0" y="0" width="1000" height="645" rx="0" fill="#f6f3ea" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1000" height="94" rx="0" fill="#173f31" stroke="none" stroke-width="1"/><text x="34" y="57" fill="#ffffff" font-size="37" font-weight="800" font-family="Arial,Helvetica,sans-serif">08  EDIT A WATCH FACE</text><text x="34" y="133" fill="#244e3a" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Select a compatible complication position on the watch</text><rect x="34" y="167" width="480" height="88" rx="12" fill="#fff" stroke="#b4cfc0" stroke-width="2"/><rect x="49" y="184" width="48" height="48" rx="24" fill="#215f45" stroke="none" stroke-width="1"/><text x="65" y="219" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">1</text><text x="111" y="203" fill="#163e2f" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Touch and hold</text><text x="111" y="234" fill="#52675b" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">your current watch face.</text><rect x="34" y="273" width="480" height="88" rx="12" fill="#fff" stroke="#b4cfc0" stroke-width="2"/><rect x="49" y="290" width="48" height="48" rx="24" fill="#215f45" stroke="none" stroke-width="1"/><text x="65" y="325" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">2</text><text x="111" y="309" fill="#163e2f" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Tap Edit; swipe left</text><text x="111" y="340" fill="#52675b" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">to Complications.</text><rect x="34" y="379" width="480" height="88" rx="12" fill="#fff" stroke="#b4cfc0" stroke-width="2"/><rect x="49" y="396" width="48" height="48" rx="24" fill="#215f45" stroke="none" stroke-width="1"/><text x="65" y="431" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">3</text><text x="111" y="415" fill="#163e2f" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Tap a slot. Turn Crown</text><text x="111" y="446" fill="#52675b" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">to select The Marker.</text><rect x="34" y="508" width="481" height="101" rx="12" fill="#e0ece4" stroke="none" stroke-width="1"/><text x="49" y="547" fill="#215941" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif">Press Crown to save, then tap</text><text x="49" y="580" fill="#215941" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif">the face to return to it.</text><rect x="584" y="144" width="367" height="454" rx="83" fill="#687369" stroke="none" stroke-width="1"/><rect x="595" y="156" width="345" height="430" rx="70" fill="#090c0b" stroke="none" stroke-width="1"/><g transform="translate(595,156)"><text x="93" y="54" fill="#8fd4a8" font-size="25" font-weight="800" font-family="Arial,Helvetica,sans-serif">EDIT</text><text x="65" y="106" fill="#fff" font-size="60" font-weight="800" font-family="Arial,Helvetica,sans-serif">10:09</text><rect x="43" y="170" width="262" height="113" rx="15" fill="#26382d" stroke="#8fd4a8" stroke-width="4"/><text x="60" y="207" fill="#8fd4a8" font-size="18" font-weight="800" font-family="Arial,Helvetica,sans-serif">THE MARKER</text><text x="60" y="239" fill="#fff" font-size="20" font-weight="800" font-family="Arial,Helvetica,sans-serif">HOLE 7 · PAR 5</text><text x="60" y="269" fill="#fff" font-size="22" font-weight="600" font-family="Arial,Helvetica,sans-serif">Alex 6  Sam 5</text><text x="62" y="342" fill="#c5cfc8" font-size="23" font-weight="600" font-family="Arial,Helvetica,sans-serif">Choose a suitable slot</text><text x="62" y="384" fill="#ffc48a" font-size="21" font-weight="600" font-family="Arial,Helvetica,sans-serif">Then select The Marker</text></g></svg>
