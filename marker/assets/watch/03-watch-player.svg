<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="645" viewBox="0 0 1000 645" role="img" aria-label="Apple Watch single-golfer view with score, par, and crown navigation"><title>Apple Watch single-golfer view with score, par, and crown navigation</title><rect x="0" y="0" width="1000" height="645" rx="0" fill="#f6f3ea" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1000" height="94" rx="0" fill="#173f31" stroke="none" stroke-width="1"/><text x="34" y="57" fill="#ffffff" font-size="37" font-weight="800" font-family="Arial,Helvetica,sans-serif">03  ONE GOLFER</text><text x="34" y="133" fill="#244e3a" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Tap a player, swipe to others, turn the Digital Crown</text><rect x="34" y="181" width="480" height="88" rx="12" fill="#fff" stroke="#b4cfc0" stroke-width="2"/><rect x="49" y="198" width="48" height="48" rx="24" fill="#215f45" stroke="none" stroke-width="1"/><text x="65" y="233" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">1</text><text x="111" y="217" fill="#163e2f" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Tap a golfer's row.</text><text x="111" y="248" fill="#52675b" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">See the hole and score.</text><rect x="34" y="287" width="480" height="88" rx="12" fill="#fff" stroke="#b4cfc0" stroke-width="2"/><rect x="49" y="304" width="48" height="48" rx="24" fill="#215f45" stroke="none" stroke-width="1"/><text x="65" y="339" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">2</text><text x="111" y="323" fill="#163e2f" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Swipe left or right</text><text x="111" y="354" fill="#52675b" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">to another golfer.</text><rect x="34" y="393" width="480" height="88" rx="12" fill="#fff" stroke="#b4cfc0" stroke-width="2"/><rect x="49" y="410" width="48" height="48" rx="24" fill="#215f45" stroke="none" stroke-width="1"/><text x="65" y="445" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">3</text><text x="111" y="429" fill="#163e2f" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Turn the Digital Crown</text><text x="111" y="460" fill="#52675b" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">to review earlier holes.</text><rect x="33" y="536" width="487" height="77" rx="12" fill="#e0ece4" stroke="none" stroke-width="1"/><text x="50" y="566" fill="#24503a" font-size="20" font-weight="700" font-family="Arial,Helvetica,sans-serif">After Crown browsing, the display</text><text x="50" y="597" fill="#24503a" font-size="20" font-weight="600" font-family="Arial,Helvetica,sans-serif">returns to the latest hole in 30 seconds.</text><rect x="586" y="142" width="362" height="456" rx="83" fill="#687369" stroke="none" stroke-width="1"/><rect x="597" y="154" width="340" height="432" rx="70" fill="#090c0b" stroke="none" stroke-width="1"/><g transform="translate(597,154)"><text x="30" y="58" fill="#8fd4a8" font-size="31" font-weight="800" font-family="Arial,Helvetica,sans-serif">Alex</text><text x="27" y="105" fill="#babfbb" font-size="24" font-weight="600" font-family="Arial,Helvetica,sans-serif">Hole 7 · Par 5 · 460 yds</text><text x="142" y="223" fill="#fff" font-size="92" font-weight="800" font-family="Arial,Helvetica,sans-serif">6</text><text x="118" y="278" fill="#ffc48a" font-size="29" font-weight="600" font-family="Arial,Helvetica,sans-serif">Bogey</text><text x="31" y="337" fill="#c7ceca" font-size="24" font-weight="600" font-family="Arial,Helvetica,sans-serif">Thru 7</text><text x="164" y="337" fill="#fff" font-size="29" font-weight="600" font-family="Arial,Helvetica,sans-serif">35</text><text x="255" y="337" fill="#ffc48a" font-size="29" font-weight="600" font-family="Arial,Helvetica,sans-serif">+6</text><rect x="65" y="363" width="210" height="56" rx="16" fill="#3d4944" stroke="none" stroke-width="1"/><text x="118" y="401" fill="#fff" font-size="26" font-weight="700" font-family="Arial,Helvetica,sans-serif">Summary</text></g><rect x="957" y="297" width="19" height="74" rx="8" fill="#889c91" stroke="none" stroke-width="1"/><text x="944" y="395" fill="#24503a" font-size="33" font-weight="600" font-family="Arial,Helvetica,sans-serif">↻</text></svg>
