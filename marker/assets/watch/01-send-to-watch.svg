<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="645" viewBox="0 0 1000 645" role="img" aria-label="Send the scorecard from The Marker on your paired iPhone to the watch"><title>Send the scorecard from The Marker on your paired iPhone to the watch</title><rect x="0" y="0" width="1000" height="645" rx="0" fill="#f6f3ea" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1000" height="94" rx="0" fill="#173f31" stroke="none" stroke-width="1"/><text x="34" y="57" fill="#ffffff" font-size="37" font-weight="800" font-family="Arial,Helvetica,sans-serif">01  SEND TO MY WATCH</text><text x="34" y="133" fill="#244e3a" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">iPhone action — then the watch opens the shared card</text><rect x="34" y="167" width="480" height="88" rx="12" fill="#fff" stroke="#b4cfc0" stroke-width="2"/><rect x="49" y="184" width="48" height="48" rx="24" fill="#215f45" stroke="none" stroke-width="1"/><text x="65" y="219" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">1</text><text x="111" y="203" fill="#163e2f" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">On the iPhone, open</text><text x="111" y="234" fill="#52675b" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">your active or Following card.</text><rect x="34" y="273" width="480" height="88" rx="12" fill="#fff" stroke="#b4cfc0" stroke-width="2"/><rect x="49" y="290" width="48" height="48" rx="24" fill="#215f45" stroke="none" stroke-width="1"/><text x="65" y="325" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">2</text><text x="111" y="309" fill="#163e2f" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Tap Send to my watch.</text><text x="111" y="340" fill="#52675b" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">The iPhone sends the card.</text><rect x="34" y="379" width="480" height="88" rx="12" fill="#fff" stroke="#b4cfc0" stroke-width="2"/><rect x="49" y="396" width="48" height="48" rx="24" fill="#215f45" stroke="none" stroke-width="1"/><text x="65" y="431" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">3</text><text x="111" y="415" fill="#163e2f" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Open The Marker on</text><text x="111" y="446" fill="#52675b" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">your paired Apple Watch.</text><text x="39" y="573" fill="#244e3a" font-size="21" font-weight="600" font-family="Arial,Helvetica,sans-serif">If the Watch app is missing, install it</text><text x="39" y="601" fill="#244e3a" font-size="21" font-weight="600" font-family="Arial,Helvetica,sans-serif">from the iPhone Watch app first.</text><rect x="582" y="145" width="224" height="406" rx="35" fill="#273329" stroke="none" stroke-width="1"/><rect x="591" y="157" width="206" height="380" rx="27" fill="#fff" stroke="none" stroke-width="1"/><rect x="636" y="166" width="115" height="15" rx="10" fill="#111" stroke="none" stroke-width="1"/><text x="614" y="222" fill="#1e6044" font-size="22" font-weight="800" font-family="Arial,Helvetica,sans-serif">THE MARKER</text><text x="612" y="274" fill="#202b23" font-size="28" font-weight="800" font-family="Arial,Helvetica,sans-serif">Following</text><text x="612" y="311" fill="#52675b" font-size="20" font-weight="600" font-family="Arial,Helvetica,sans-serif">Lakeside GC</text><rect x="610" y="363" width="168" height="88" rx="13" fill="#1d6545" stroke="none" stroke-width="1"/><text x="623" y="397" fill="#fff" font-size="23" font-weight="800" font-family="Arial,Helvetica,sans-serif">Send to</text><text x="623" y="427" fill="#fff" font-size="23" font-weight="800" font-family="Arial,Helvetica,sans-serif">my watch</text><text x="620" y="495" fill="#516357" font-size="19" font-weight="600" font-family="Arial,Helvetica,sans-serif">iPhone</text><rect x="813" y="215" width="157" height="236" rx="52" fill="#657368" stroke="none" stroke-width="1"/><rect x="821" y="222" width="141" height="221" rx="45" fill="#090c0b" stroke="none" stroke-width="1"/><text x="844" y="283" fill="#8fd4a8" font-size="20" font-weight="600" font-family="Arial,Helvetica,sans-serif">The Marker</text><text x="840" y="332" fill="#fff" font-size="18" font-weight="600" font-family="Arial,Helvetica,sans-serif">No card yet</text><text x="839" y="356" fill="#bbb" font-size="17" font-weight="600" font-family="Arial,Helvetica,sans-serif">Open a card</text><text x="835" y="379" fill="#bbb" font-size="16" font-weight="600" font-family="Arial,Helvetica,sans-serif">on your iPhone</text><text x="839" y="477" fill="#42654f" font-size="19" font-weight="600" font-family="Arial,Helvetica,sans-serif">Apple Watch</text></svg>
