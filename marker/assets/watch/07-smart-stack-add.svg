<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="645" viewBox="0 0 1000 645" role="img" aria-label="Adding and pinning The Marker the group in Apple Watch Smart Stack"><title>Adding and pinning The Marker the group in Apple Watch Smart Stack</title><rect x="0" y="0" width="1000" height="645" rx="0" fill="#f6f3ea" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1000" height="94" rx="0" fill="#173f31" stroke="none" stroke-width="1"/><text x="34" y="57" fill="#ffffff" font-size="37" font-weight="800" font-family="Arial,Helvetica,sans-serif">07  ADD + PIN THE GROUP</text><text x="34" y="133" fill="#244e3a" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Edit Smart Stack → Add Widget → The Marker → Pin</text><rect x="34" y="169" width="480" height="88" rx="12" fill="#fff" stroke="#b4cfc0" stroke-width="2"/><rect x="49" y="186" width="48" height="48" rx="24" fill="#215f45" stroke="none" stroke-width="1"/><text x="65" y="221" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">1</text><text x="111" y="205" fill="#163e2f" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">In Edit, tap +</text><text x="111" y="236" fill="#52675b" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">Add Widget.</text><rect x="34" y="275" width="480" height="88" rx="12" fill="#fff" stroke="#b4cfc0" stroke-width="2"/><rect x="49" y="292" width="48" height="48" rx="24" fill="#215f45" stroke="none" stroke-width="1"/><text x="65" y="327" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">2</text><text x="111" y="311" fill="#163e2f" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Find The Marker:</text><text x="111" y="342" fill="#52675b" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">the group (rectangular).</text><rect x="34" y="381" width="480" height="88" rx="12" fill="#fff" stroke="#b4cfc0" stroke-width="2"/><rect x="49" y="398" width="48" height="48" rx="24" fill="#215f45" stroke="none" stroke-width="1"/><text x="65" y="433" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">3</text><text x="111" y="417" fill="#163e2f" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Add it, tap its pin</text><text x="111" y="448" fill="#52675b" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">icon, then tap Done.</text><rect x="35" y="530" width="478" height="80" rx="12" fill="#e2efe5" stroke="none" stroke-width="1"/><text x="50" y="561" fill="#2f654b" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif">Pinned widgets stay near the top.</text><text x="50" y="596" fill="#2f654b" font-size="23" font-weight="600" font-family="Arial,Helvetica,sans-serif">My score can be added too.</text><rect x="583" y="147" width="368" height="453" rx="83" fill="#687369" stroke="none" stroke-width="1"/><rect x="594" y="159" width="346" height="429" rx="70" fill="#090c0b" stroke="none" stroke-width="1"/><g transform="translate(594,159)"><text x="33" y="64" fill="#fff" font-size="27" font-weight="800" font-family="Arial,Helvetica,sans-serif">SMART STACK</text><rect x="18" y="87" width="306" height="82" rx="14" fill="#343a37" stroke="none" stroke-width="1"/><text x="35" y="118" fill="#fff" font-size="27" font-weight="800" font-family="Arial,Helvetica,sans-serif">+  Add Widget</text><text x="35" y="149" fill="#aabbb0" font-size="19" font-weight="600" font-family="Arial,Helvetica,sans-serif">Search or browse apps</text><rect x="18" y="181" width="306" height="145" rx="15" fill="#28342d" stroke="#8fd4a8" stroke-width="2"/><text x="35" y="221" fill="#8fd4a8" font-size="24" font-weight="800" font-family="Arial,Helvetica,sans-serif">THE MARKER</text><text x="35" y="253" fill="#fff" font-size="29" font-weight="800" font-family="Arial,Helvetica,sans-serif">The group</text><text x="35" 