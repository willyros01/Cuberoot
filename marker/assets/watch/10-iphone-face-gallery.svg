<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="645" viewBox="0 0 1000 645" role="img" aria-label="Using iPhone Watch app Face Gallery to add a complication for The Marker"><title>Using iPhone Watch app Face Gallery to add a complication for The Marker</title><rect x="0" y="0" width="1000" height="645" rx="0" fill="#f6f3ea" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1000" height="94" rx="0" fill="#173f31" stroke="none" stroke-width="1"/><text x="34" y="57" fill="#ffffff" font-size="37" font-weight="800" font-family="Arial,Helvetica,sans-serif">10  ALTERNATIVE: iPHONE</text><text x="34" y="133" fill="#244e3a" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">You can edit the face with the Watch app on your iPhone</text><rect x="34" y="167" width="480" height="88" rx="12" fill="#fff" stroke="#b4cfc0" stroke-width="2"/><rect x="49" y="184" width="48" height="48" rx="24" fill="#215f45" stroke="none" stroke-width="1"/><text x="65" y="219" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">1</text><text x="111" y="203" fill="#163e2f" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Open Apple's Watch app</text><text x="111" y="234" fill="#52675b" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">on the paired iPhone.</text><rect x="34" y="273" width="480" height="88" rx="12" fill="#fff" stroke="#b4cfc0" stroke-width="2"/><rect x="49" y="290" width="48" height="48" rx="24" fill="#215f45" stroke="none" stroke-width="1"/><text x="65" y="325" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">2</text><text x="111" y="309" fill="#163e2f" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Tap Face Gallery</text><text x="111" y="340" fill="#52675b" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">and choose a watch face.</text><rect x="34" y="379" width="480" height="88" rx="12" fill="#fff" stroke="#b4cfc0" stroke-width="2"/><rect x="49" y="396" width="48" height="48" rx="24" fill="#215f45" stroke="none" stroke-width="1"/><text x="65" y="431" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">3</text><text x="111" y="415" fill="#163e2f" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Choose a complication</text><text x="111" y="446" fill="#52675b" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">and select The Marker.</text><rect x="34" y="506" width="481" height="96" rx="12" fill="#e0ece4" stroke="none" stroke-width="1"/><text x="52" y="543" fill="#245a41" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif">Tap Add to use the new face.</text><text x="52" y="578" fill="#245a41" font-size="22" font-weight="600" font-family="Arial,Helvetica,sans-serif">Keep the old face if you prefer.</text><rect x="632" y="139" width="262" height="477" rx="44" fill="#52655b" stroke="none" stroke-width="1"/><rect x="641" y="148" width="244" height="458" rx="37" fill="#f1f5f0" stroke="none" stroke-width="1"/><rect x="699" y="159" width="127" height="15" rx="10" fill="#141a15" stroke="none" stroke-width="1"/><text x="671" y="212" fill="#0d261b" font-size="31" font-weight="800" font-family="Arial,Helvetica,sans-serif">Watch</text><text x="663" y="258" fill="#235b42" font-size="26" font-weight="800" font-family="Arial,Helvetica,sans-serif">Face Gallery</text><rect x="667" y="279" width="189" height="135" rx="19" fill="#101810" stroke="none" stroke-width="1"/><text x="708" y="330" fill="#fff" font-size="37" font-weight="800" font-family="Arial,Helvetica,sans-serif">10:09</text><text x="687" y="373" fill="#8fd4a8" font-size="19" font-weight="600" font-family="Arial,Helvetica,sans-serif">Marker · My score</text><text x="669" y="455" fill="#172e23" font-size="21" font-weight="800" font-family="Arial,Helvetica,sans-serif">Complications</text><rect x="667" y="468" width="190" height="44" rx="12" fill="#fff" stroke="none" stroke-width="1"/><text x="678" y="498" fill="#225740" font-size="21" font-weight="600" font-family="Arial,Helvetica,sans-serif">The Marker</text><rect x="670" y="535" width="186" height="51" rx="12" fill="#225e43" stroke="none" stroke-width="1"/><text x="743" y="569" fill="#fff" font-size="25" font-weight="800" font-family="Arial,Helvetica,sans-serif">Add</text></svg>
