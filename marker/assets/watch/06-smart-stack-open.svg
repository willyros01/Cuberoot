<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="645" viewBox="0 0 1000 645" role="img" aria-label="How to open Apple Watch Smart Stack and start Edit mode"><title>How to open Apple Watch Smart Stack and start Edit mode</title><rect x="0" y="0" width="1000" height="645" rx="0" fill="#f6f3ea" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1000" height="94" rx="0" fill="#173f31" stroke="none" stroke-width="1"/><text x="34" y="57" fill="#ffffff" font-size="37" font-weight="800" font-family="Arial,Helvetica,sans-serif">06  OPEN SMART STACK</text><text x="34" y="133" fill="#244e3a" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Keep your favorite watch face — add Marker in the stack</text><rect x="34" y="173" width="480" height="88" rx="12" fill="#fff" stroke="#b4cfc0" stroke-width="2"/><rect x="49" y="190" width="48" height="48" rx="24" fill="#215f45" stroke="none" stroke-width="1"/><text x="65" y="225" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">1</text><text x="111" y="209" fill="#163e2f" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Start on your</text><text x="111" y="240" fill="#52675b" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">normal watch face.</text><rect x="34" y="279" width="480" height="88" rx="12" fill="#fff" stroke="#b4cfc0" stroke-width="2"/><rect x="49" y="296" width="48" height="48" rx="24" fill="#215f45" stroke="none" stroke-width="1"/><text x="65" y="331" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">2</text><text x="111" y="315" fill="#163e2f" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Swipe upward or turn</text><text x="111" y="346" fill="#52675b" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">the Digital Crown up.</text><rect x="34" y="385" width="480" height="88" rx="12" fill="#fff" stroke="#b4cfc0" stroke-width="2"/><rect x="49" y="402" width="48" height="48" rx="24" fill="#215f45" stroke="none" stroke-width="1"/><text x="65" y="437" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">3</text><text x="111" y="421" fill="#163e2f" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Scroll to the bottom</text><text x="111" y="452" fill="#52675b" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">and tap Edit.</text><text x="37" y="580" fill="#375a45" font-size="21" font-weight="600" font-family="Arial,Helvetica,sans-serif">These are instructional Apple Watch</text><text x="37" y="610" fill="#375a45" font-size="21" font-weight="600" font-family="Arial,Helvetica,sans-serif">diagrams, not Apple screenshots.</text><rect x="582" y="146" width="366" height="448" rx="83" fill="#687369" stroke="none" stroke-width="1"/><rect x="593" y="158" width="344" height="424" rx="70" fill="#090c0b" stroke="none" stroke-width="1"/><g transform="translate(593,158)"><text x="81" y="87" fill="#fff" font-size="61" font-weight="700" font-family="Arial,Helvetica,sans-serif">10:09</text><text x="103" y="131" fill="#8fd4a8" font-size="25" font-weight="600" font-family="Arial,Helvetica,sans-serif">FRI 30</text><circle cx="171" cy="253" r="83" fill="none" stroke="#617b66" stroke-width="9"/><text x="104" y="262" fill="#fff" font-size="24" font-weight="800" font-family="Arial,Helvetica,sans-serif">SWIPE UP</text><path d="M 172 346 L 172 302" fill="none" stroke="#ffc48a" stroke-width="8" stroke-linecap="round"/><path d="M 147 327 L 172 299 L 197 327" fill="none" stroke="#ffc48a" stroke-width="8" stroke-linejoin="round"/></g></svg>
