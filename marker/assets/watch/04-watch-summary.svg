<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="645" viewBox="0 0 1000 645" role="img" aria-label="Apple Watch player's Summary screen with Out In Total"><title>Apple Watch player's Summary screen with Out In Total</title><rect x="0" y="0" width="1000" height="645" rx="0" fill="#eaf0f6" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1000" height="94" rx="0" fill="#172b3f" stroke="none" stroke-width="1"/><text x="34" y="57" fill="#ffffff" font-size="37" font-weight="800" font-family="Arial,Helvetica,sans-serif">04  ROUND SUMMARY</text><text x="34" y="133" fill="#24394e" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">The player screen's Summary button opens these totals</text><rect x="34" y="181" width="480" height="88" rx="12" fill="#fff" stroke="#b4c2cf" stroke-width="2"/><rect x="49" y="198" width="48" height="48" rx="24" fill="#21405f" stroke="none" stroke-width="1"/><text x="65" y="233" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">1</text><text x="111" y="217" fill="#162a3e" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">From one golfer's</text><text x="111" y="248" fill="#525c67" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">hole screen, tap Summary.</text><rect x="34" y="287" width="480" height="88" rx="12" fill="#fff" stroke="#b4c2cf" stroke-width="2"/><rect x="49" y="304" width="48" height="48" rx="24" fill="#21405f" stroke="none" stroke-width="1"/><text x="65" y="339" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">2</text><text x="111" y="323" fill="#162a3e" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Check Out, In</text><text x="111" y="354" fill="#525c67" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">and Total for the round.</text><rect x="34" y="393" width="480" height="88" rx="12" fill="#fff" stroke="#b4c2cf" stroke-width="2"/><rect x="49" y="410" width="48" height="48" rx="24" fill="#21405f" stroke="none" stroke-width="1"/><text x="65" y="445" fill="#fff" font-size="30" font-weight="800" font-family="Arial,Helvetica,sans-serif">3</text><text x="111" y="429" fill="#162a3e" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">Use Back to return</text><text x="111" y="460" fill="#525c67" font-size="23" font-weight="500" font-family="Arial,Helvetica,sans-serif">to the group or golfer.</text><text x="41" y="569" fill="#31475e" font-size="22" font-weight="600" font-family="Arial,Helvetica,sans-serif">In stays blank until holes</text><text x="41" y="603" fill="#31475e" font-size="22" font-weight="600" font-family="Arial,Helvetica,sans-serif">on the back nine are scored.</text><rect x="586" y="148" width="362" height="454" rx="83" fill="#686e73" stroke="none" stroke-width="1"/><rect x="597" y="160" width="340" height="430" rx="70" fill="#090a0c" stroke="none" stroke-width="1"/><g transform="translate(597,160)"><text x="27" y="66" fill="#8cc4f5" font-size="32" font-weight="800" font-family="Arial,Helvetica,sans-serif">Alex</text><text x="27" y="108" fill="#adb2b8" font-size="23" font-weight="600" font-family="Arial,Helvetica,sans-serif">Summary · thru 7</text><path d="M 29 144 L 320 144" fill="none" stroke="#33373b" stroke-width="2" stroke-linecap="round"/><text x="31" y="194" fill="#b8bdc2" font-size="28" font-weight="600" font-family="Arial,Helvetica,sans-serif">Out</text><text x="170" y="194" fill="#fff" font-size="30" font-weight="600" font-family="Arial,Helvetica,sans-serif">35</text><text x="252" y="194" fill="#ffc48a" font-size="30" font-weight="600" font-family="Arial,Helvetica,sans-serif">+6</text><path d="M 29 214 L 320 214" fill="none" stroke="#33373b" stroke-width="2" stroke-linecap="round"/><text x="31" y="265" fill="#b8bdc2" font-size="28" font-weight="600" font-family="Arial,Helvetica,sans-serif">In</text><text x="170" y="265" fill="#fff" font-size="28" font-weight="600" font-family="Arial,Helvetica,sans-serif">—</text><text x="252" y="265" fill="#fff" font-size="28" font-weight="600" font-family="Arial,Helvetica,sans-serif">—</text><path d="M 29 287 L 320 287" fill="none" stroke="#33373b" stroke-width="2" stroke-linecap="round"/><text x="31" y="342" fill="#b8bdc2" font-size="29" font-weight="800" font-family="Arial,Helvetica,sans-serif">Total</text><text x="170" y="342" fill="#fff" font-size="32" font-weight="800" font-family="Arial,Helvetica,sans-serif">35</text><text x="252" y="342" fill="#ffc48a" font-size="31" font-weight="800" font-family="Arial,Helvetica,sans-serif">+6</text><text x="31" y="399" fill="#adb2b8" font-size="19" font-weight="600" font-family="Arial,Helvetica,sans-serif">Updated 2:43 PM</text></g></svg>
