<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Marker — source-matched guide screen</title><link rel="stylesheet" href="../assets/marker-source.css"><style>html,body{height:auto;min-height:100%;} body{background:var(--ground)} #app{min-height:100vh} button,input,select,a{pointer-events:none}button{cursor:default} .card-nine{overflow-x:auto;border:1px solid var(--line);padding:6px;background:white}.card-nine td,.card-nine th{border:1px solid var(--line);padding:5px 1px}</style></head>
<body><div id="app"></div><script>(function markerGuideScreens(){
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const top=(t,sub="",right="")=>`<header class="top"><div class="row"><div class="sub">${esc(sub)}</div><div class="row">${right}</div></div><div class="title">${esc(t)}</div></header>`;
  const footer=(...buttons)=>`<footer class="foot">${buttons.join("")}</footer>`;
  const btn=(txt,classes="",more="")=>`<button class="btn ${classes}" ${more}>${txt}</button>`;
  const field=(label,content)=>`<div class="field"><span class="label">${label}</span>${content}</div>`;
  const pick=(name,meta="",on=false)=>`<button class="item ${on?"on":""}"><span class="box">${on?"✓":""}</span><span class="txt"><span class="name">${name}</span>${meta?`<span class="meta">${meta}</span>`:""}</span></button>`;
  const start=()=> top("The Marker","Hole-by-hole scorecard") + `<main class="body">${btn('<span>Sign in with The Scorecard</span><small>Pick golfers from your groups. Scores are posted for them.</small>',"primary tall")}${btn('<span>Play without an account</span><small>Type the players\' names. Keep and share the card; nothing is posted.</small>',"outline tall")}<p class="muted">Every score is saved on this phone the moment you enter it, so a lost signal or a flat battery loses nothing.</p></main>`+footer(`<div class="links"><a>Support</a><a>Privacy</a><span class="muted">v0.5.4</span></div>`);
  const signin=()=>top("Sign in","With your Scorecard account")+`<main class="body"><p>Use the same email and password as The Scorecard.</p>${field("Email",'<input class="input" type="email" placeholder="Email address">')}${field("Password",'<input class="input" type="password" value="illustration">')}${btn("Sign in","primary")}${btn("Forgot the password? Send a reset email","dashed")}</main>`+footer(btn("← Back"));
  const setup=()=>top("Set up the round","Playing without an account")+`<main class="body">${field("Date",'<div class="stepper"><button>−</button><div class="val">17 Oct 2026</div><button>+</button></div>')}${field("Course",btn("Sample Links Golf Club ▸","","style='justify-content:flex-start'"))}${field("Tee",`<div class="list">${pick("White","70.1 / 125 · par 72",true)}${pick("Blue","72.2 / 130 · par 72",false)}</div>`)}${btn("Check the holes (par, yards, handicap)")}${field("Holes",'<div class="row3"><button class="choice on">18 holes</button><button class="choice">Front 9</button><button class="choice">Back 9</button></div>')}${field("Starting hole",'<div class="stepper"><button>−</button><div class="val">1</div><button>+</button></div><span class="muted">For a shotgun start, choose the hole you begin on.</span>')}${field("Score entry",'<div class="row2"><button class="choice on">One golfer at a time</button><button class="choice">All four together</button></div>')}</main>`+footer(btn("Choose the players →","primary"),btn("← Back"));
  const course=()=>top("Choose a course","Saved courses, or search")+`<main class="body">${field("Course or club name",'<input class="input" placeholder="e.g. Royal Ontario" value="Sample">')}<div class="row2">${btn("Show saved")}${btn("Search online","primary")}</div><span class="label">Saved courses</span><div class="list">${pick("Sample Links Golf Club","2 tees")}${pick("River Bend Golf Course","1 tee")}</div>${btn("Enter a course yourself","dashed")}</main>`+footer(btn("← Back"));
  const manualRows=[1,2,3,4,5,6,7,8,9].map((n)=>`<div class="hole-row"><b>${n}</b><select><option>${n%4===1?4:n%4===2?5:3}</option></select><input class="input" value="${370+n*6}"><select><option>${n}</option></select></div>`).join("");
  const photoButtons='<span class="label">Read it from a picture of the club\'s scorecard</span><p class="muted">Take one picture of the whole card: all 18 holes and every tee. Lay it flat, in good light.</p><div class="row2"><label class="btn dashed">📷 Take a photo</label><label class="btn dashed">🖼 Photos or Files</label></div>';
  const manual=(photo)=>top("Enter a course","From the scorecard at the club")+`<main class="body">${photo?photoButtons:""}${field("Course name",'<input class="input" value="Sample Links Golf Club">')}${field("Tee",'<input class="input" value="White">')}<div class="row2">${field("Rating",'<input class="input" value="70.1">')}${field("Slope",'<input class="input" value="125">')}</div><p class="muted">Rating and slope are needed only to post rounds to The Scorecard.</p><span class="label">Each hole: par, yards and handicap number (HCP)</span><div class="hole-rows"><div class="hole-row hd"><span>Hole</span><span>Par</span><span>Yards</span><span>HCP</span></div>${manualRows}</div></main>`+footer(btn("Use this course","primary"),btn("← Back"));
  const verify=()=>top("Check against the card","Sample Links Golf Club")+`<main class="body"><div class="verdict ok"><span class="big">✓</span><div><b>Everything on the card was read, and it all adds up.</b><br>2 tees, par 72. Compare it with the card one last time.</div></div><span class="label">OUT · HOLES 1–9</span><div class="card-nine"><table style="border-collapse:collapse;font-size:15px;width:100%"><tr><th>TEE</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th></tr><tr style="background:#fff"><th>White</th><td>4</td><td>5</td><td>3</td><td>4</td><td>4</td><td>5</td><td>3</td><td>4</td><td>4</td></tr><tr style="background:#e6efe9"><th>Blue</th><td>4</td><td>5</td><td>3</td><td>4</td><td>4</td><td>5</td><td>3</td><td>4</td><td>4</td></tr></table></div><span class="label">IN · HOLES 10–18</span><p class="muted">The same check is performed for each tee and nine.</p></main>`+footer(btn('<span>✓ This matches the card</span><small>Used on this phone. Sign in to share it with every scorer.</small>',"primary tall"),btn("Correct it by hand instead"),btn("← Back"));
  const players=()=>top("Who's playing?","Sample Links Golf Club · White",'<span class="pill">3 of 4</span>')+`<main class="body"><label class="field"><span class="label">Group</span><select class="input"><option>Weekend Golfers (2 chosen)</option></select></label><div class="list">${pick("Alex Green","Index 12.4",true)}${pick("Sam Reed","Index 18.1",true)}${pick("Tina Brooks","Index 22.6")}${pick("Jordan Lee","Index 9.8")}</div><p class="muted">Only golfers already in your groups can be posted. Anyone else: add them below as a guest.</p><span class="label">Guests · scored and shared, not posted</span><div class="item on"><span class="box">✓</span><span class="txt"><span class="name">Pat Morris</span><span class="meta">Guest</span></span>${btn("Remove","","style='min-height:44px'")}</div><div class="row2" style="grid-template-columns:minmax(0,1fr) auto"><input class="input" placeholder="Guest's name">${btn("Add")}</div></main>`+footer(btn("Tee off on hole 1 →","primary"),btn("← Back"));
  const hole=()=>'<header class="top"><div class="row"><div class="sub">Sample Links Golf Club · White · hole 1 of 18</div><div class="row"><span class="pill">✓ Saved</span><button class="pill light">Menu</button></div></div><div class="hole-title"><span class="big">Hole 1</span><span class="par">Par 4</span></div><div class="hole-meta"><span>384 yards</span><span>Handicap 11</span></div></header>';
  const footPlay=()=>footer('<div class="row3">'+btn("← Back","","disabled")+btn("Card")+btn("Hole 2 →","primary")+'</div>');
  const one=()=>hole()+`<nav class="names"><button class="now">Alex 4</button><button class="done">Sam 5</button><button>Pat</button></nav><main class="body"><div class="who"><div class="step">Golfer 1 of 3</div><div class="name">Alex Green</div><div class="muted">Gets 1 stroke here · handicap limit 6</div></div><div class="status done">Entered: 4. Tap another number to change it, or tap the next name above.</div><div class="tiles">${Array.from({length:9},(_,i)=>{const v=i+2,label=({2:"Eagle",3:"Birdie",4:"✓ Entered",5:"Bogey",6:"Double",7:"Triple"})[v]||`+${v-4}`;return `<button class="tile ${v===4?"on":""}"><b>${v}</b><span>${label}</span></button>`}).join("")}</div><div class="row2">${btn("Type a score","dashed")}${btn("Picked up","dashed")}</div></main>`+footPlay();
  const all=()=>hole()+`<main class="body">${[["Alex Green","4","+0 thru 1"],["Sam Reed","5","+1 thru 1"],["Pat Morris","X",""],["Jordan Lee","4","E thru 1"]].map(([name,score,tot])=>`<div class="player"><div class="head"><b>${name}</b><span>${tot}</span></div><div class="ctl"><button class="minus">−</button><input value="${score}"><button class="plus">+</button></div><div class="note">${name==="Pat Morris"?"Guest · not posted · ":""}No index · handicap limit 6</div></div>`).join("")}<p class="muted">Tap + to start at par. Tap a number to type it; X means picked up.</p></main>`+footPlay();
  const menu=()=>top("Menu","Sample Links Golf Club · White · hole 1")+`<main class="body">${btn("<span>Switch to all four together</span><small>The scores already entered stay as they are.</small>","tall")}${btn("<span>See the whole card</span><small>Every hole, with par, yards and handicap number. Tap a hole to go to it.</small>","tall")}${btn("<span>Share the card</span><small>WhatsApp, email or text message.</small>","tall")}${btn('<span>Go to the start screen</span><small>The round stays on this phone. "Continue your round" brings you back to this hole.</small>',"tall")}${btn('<span>End this round without posting</span><small>The card is kept under "Your cards" and is never posted.</small>',"tall","style='color:var(--over)'")}</main>`+footer(btn("Back to hole 1 →","primary"));
  const scoreTable=()=>`<div class="cgrid" style="--n:2"><div class="crow"><div class="hd">HOLE</div><div class="hd">PAR</div><div class="hd">YDS</div><div class="hd">HCP</div><div class="hd">ALEX</div><div class="hd">SAM</div></div>${Array.from({length:18},(_,i)=>`<div class="crow ${i===0?"now-row":i%2?"zebra":"plain"}"><div style="font-weight:800">${i+1}</div><div>${i%3===2?3:4}</div><div style="color:var(--ink-3)">${356+(i*7)%44}</div><div style="color:var(--ink-3)">${i+1}</div><div style="font-weight:700">4</div><div class="over" style="font-weight:700">5</div></div>`).join("")}<div class="crow total"><div style="grid-column:span 4">Thru 18</div><div>+4</div><div>+14</div></div></div>`;
  const card=()=>top("The card","Tap a hole to go back and change it")+`<main class="body" style="padding:10px">${scoreTable()}</main>`+footer(btn("Back to hole 1 →","primary"),btn("Share the card"));
  const sums=()=>[["Alex Green","Weekend Golfers","90","88","80"],["Sam Reed","Weekend Golfers","94","92","82"],["Pat Morris","Guest · shared only, not posted","96","—","—"]].map(([name,where,gross,adj,net])=>`<div class="sum"><b style="font-size:19px">${name}</b><span class="muted">${where}</span><div class="stats"><div><b>${gross}</b><span>Gross</span></div><div><b>${adj}</b><span>Adjusted</span></div><div><b style="color:var(--green)">${net}</b><span>Net (CH 10)</span></div></div></div>`).join("");
  const finish=()=>top("Round finished","Sample Links Golf Club · 17 Oct 2026")+`<main class="body"><p class="muted">Check the totals before posting. Adjusted applies net double bogey on each hole, worked out for you.</p>${sums()}</main>`+footer(btn("Post 2 rounds to The Scorecard","primary"),'<div class="row2">'+btn("Share the card")+btn("Review card")+'</div>');
  const status=()=>top("The Marker","Posting")+`<main class="body"><h2>Posted to The Scorecard</h2><p>The rounds are in The Scorecard now, and the handicap indexes are up to date.</p><div class="list">${["Alex Green","Sam Reed"].map(n=>`<div class="item"><span class="txt"><span class="name">${n} · 90</span><span class="meta">Weekend Golfers</span></span><b style="color:var(--green)">Posted ✓</b></div>`).join("")}</div><p class="muted">Each one shows "Posted" only once The Scorecard has actually saved it.</p></main>`+footer(btn("Done","primary"),btn("Share the card"));
  const history=()=>top("Your cards","Kept on this phone")+`<main class="body"><div class="list">${["Sample Links Golf Club","River Bend","Oak Ridge"].map((n,i)=>`<button class="item"><span class="txt"><span class="name">${n}</span><span class="meta">17 Oct 2026 · Alex, Sam · ${i===2?"posted":"not posted"}</span></span></button>`).join("")}</div></main>`+footer(btn("← Back"));
  const share=()=>top("Share the card","WhatsApp, email, text or copy")+`<main class="body">${btn("WhatsApp","primary")}${btn("Email")}${btn("Text message")}${btn("Copy")}<pre style="white-space:pre-wrap;font-size:16px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px">Sample Links Golf Club\n17 Oct 2026\nAlex: 90\nSam: 94</pre></main>`+footer(btn("← Back"));
  const views={choose:start,signin,setup,course,manual:()=>manual(false),photo:()=>manual(true),verify,players,games:setup,one,all,menu,card,finish,totals:finish,post:finish,status,history,share,help:status};
  const id=new URLSearchParams(location.search).get("view")||"choose";
  document.title="The Marker — "+id+" (documentation example)";
  document.getElementById("app").innerHTML=(views[id]||views.choose)();
})();</script></body></html>
